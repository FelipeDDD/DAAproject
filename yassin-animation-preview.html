<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yassin — prévia das animações</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:#18212c; color:#e8edf4; font:16px/1.5 system-ui,sans-serif; }
    main { max-width:1120px; margin:auto; }
    h1 { font-size:24px; margin:0 0 8px; }
    a { color:#b9d8ff; }
    .controls { display:flex; flex-wrap:wrap; gap:20px; align-items:center; margin:24px 0; }
    button,select { font:inherit; padding:6px 12px; }
    label { display:flex; gap:10px; align-items:center; }
    #directions { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    figure { margin:0; text-align:center; background:#28323d; border:1px solid #526171; border-radius:8px; overflow:hidden; }
    canvas { display:block; width:256px; height:288px; max-width:100%; object-fit:contain; margin:auto; image-rendering:pixelated; }
    figcaption { padding:12px; }
    #status { color:#c4ced9; }
  </style>
</head>
<body>
<main>
  <h1>Yassin — prévia das animações</h1>
  <p>Compare as quatro direções e pause para conferir mãos e pés.</p>
  <p><a href="./index.html">Abrir o jogo — Yassin → terceira skin no guarda-roupa</a></p>
  <div class="controls">
    <button id="play" type="button">Pausar</button>
    <label>Movimento <select id="motion"><option value="walk">Caminhada</option><option value="idle">Parado</option></select></label>
    <label>Frame <input id="frame" type="range" min="0" max="5" value="1" aria-label="Frame da animação"><output id="frame-number">1</output></label>
  </div>
  <div id="directions"></div>
  <p id="status" role="status">Carregando spritesheet…</p>
</main>
<script type="module">
  import {YASSIN_BALD_TEST_VISUAL as visual} from './src/experimental/yassinBaldSkin.js';
  import {normalizeYassinUpStride} from './src/art/yassinUpStride.js';
  const directions=[['down','Frente'],['left','Esquerda'],['right','Direita'],['up','Costas']];
  const canvases=directions.map(([,name])=>{
    const figure=document.createElement('figure');
    const canvas=document.createElement('canvas');canvas.width=visual.frameWidth;canvas.height=visual.frameHeight;
    canvas.setAttribute('aria-label',name);
    const caption=document.createElement('figcaption');caption.textContent=name;
    figure.append(canvas,caption);document.getElementById('directions').append(figure);
    const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;return context;
  });
  const play=document.getElementById('play'),motion=document.getElementById('motion');
  const slider=document.getElementById('frame'),number=document.getElementById('frame-number');
  const status=document.getElementById('status');
  let sheet=new Image();sheet.src=`./${visual.asset}`;
  let playing=true,ready=false,start=performance.now();
  function render(column,walking=false,index=0){
    if(!ready)return;
    canvases.forEach((context,row)=>{
      const col=walking?visual.walkColumns[directions[row][0]][index%visual.walkColumns[directions[row][0]].length]:column;
      context.clearRect(0,0,visual.frameWidth,visual.frameHeight);
      context.drawImage(sheet,col*visual.frameWidth,row*visual.frameHeight,visual.frameWidth,visual.frameHeight,0,0,visual.frameWidth,visual.frameHeight);
    });
    slider.value=String(column);number.value=String(column);
  }
  play.addEventListener('click',()=>{playing=!playing;start=performance.now();play.textContent=playing?'Pausar':'Retomar';});
  slider.addEventListener('input',()=>{playing=false;play.textContent='Retomar';render(Number(slider.value));});
  motion.addEventListener('change',()=>{start=performance.now();render(motion.value==='idle'?0:1);});
  function tick(now){
    if(ready&&playing){
      const index=Math.floor((now-start)*visual.frameRate/1000);
      const walking=motion.value==='walk';
      render(walking?visual.walkColumns.down[index%visual.walkColumns.down.length]:0,walking,index);
    }
    requestAnimationFrame(tick);
  }
  try {await sheet.decode();if(visual.normalizeUpStride){const canvas=document.createElement('canvas');canvas.width=768;canvas.height=576;const ctx=canvas.getContext('2d');ctx.drawImage(sheet,0,0);const pixels=ctx.getImageData(0,0,768,576);pixels.data.set(normalizeYassinUpStride(pixels.data));ctx.putImageData(pixels,0,0);sheet=canvas;}ready=true;status.textContent=`24 frames · 4 direções · ${visual.frameRate} FPS · exibição ampliada 2×`;requestAnimationFrame(tick);}
  catch {status.textContent='Não foi possível carregar o spritesheet. Recarregue esta página pelo servidor do jogo.';}
</script>
</body>
</html>
